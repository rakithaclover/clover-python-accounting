# Publishes an existing GitHub release of clover-python-accounting to PyPI.
# Prepared and off: it runs only by hand, waits for approval in the "pypi" environment, and cannot
# upload until a trusted publisher for this workflow is registered on PyPI (CONTRIBUTING-CLOVER.md).

name: clover-publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v2.1.0.1"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/clover-python-accounting
    permissions:
      contents: read
      id-token: write  # PyPI trusted publishing
    steps:
      - name: Download the release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "*.whl" --pattern "*.tar.gz" --pattern "SHA256SUMS"
          cd dist && sha256sum --check SHA256SUMS && rm SHA256SUMS
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
