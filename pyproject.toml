[project]
name = "clover-python-accounting"
version = "2.1.0.1"
description = "A maintained distribution of python-accounting, the double entry accounting library, with fixes for larger amounts, session isolation and ledger integrity"
authors = [{ name = "Edward Mungai", email = "emungai@microbooks.io" }]
maintainers = [{ name = "Clover" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy (>=2.1.4,<2.2)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
]

[project.urls]
Homepage = "https://github.com/rakithaclover/clover-python-accounting"
Source = "https://github.com/rakithaclover/clover-python-accounting"
Changes = "https://github.com/rakithaclover/clover-python-accounting/blob/clover/2.1/NOTICE.md"
Upstream = "https://github.com/ekmungai/python-accounting"
Documentation = "https://python-accounting.readthedocs.io/en/latest/"

[project.optional-dependencies]
mysql = ["mysqlclient (>=2.3.0,<3.0.0)"]
postgresql = ["psycopg2 (>=2.9.13,<3.0.0)"]

[tool.poetry]
packages = [{include = "python_accounting"}, {include = "config.toml"}]

[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"

[tool.poetry.group.dev.dependencies]
sphinx-autoapi = "^3.8.1"
sphinx-rtd-theme = "^3.1.0"
sphinx = "^9.0.4"
myst-parser = "^5.1.0"
pylint = "^4.1.3"
tox = "^4.66.0"
dill = "^0.4.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
